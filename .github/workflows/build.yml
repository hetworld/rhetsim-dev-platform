name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Repository smoke test
        run: scripts/tests/smoke.sh

      - name: ShellCheck
        run: shellcheck $(find scripts sdk/scripts -name '*.sh' -type f) run.sh || true
